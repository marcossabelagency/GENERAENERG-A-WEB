<!-- @dsCard group="Datos" height=220 -->
<div class="g-root" style="padding:40px;background:var(--surface-000);min-height:100%">
 <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px">
  <div class="g-stat g-reveal" style="--i:0"><div class="g-stat__value"><span data-count="70">0</span><span class="g-stat__unit">%</span></div><div class="g-stat__label">Ahorro estimado en la factura*</div><div class="g-stat__bar"><span style="--_v:70%"></span></div></div>
  <div class="g-stat g-reveal" style="--i:1"><div class="g-stat__value"><span data-count="25">0</span><span class="g-stat__unit"> años</span></div><div class="g-stat__label">Garantía de producción*</div><div class="g-stat__bar"><span style="--_v:100%"></span></div></div>
  <div class="g-stat g-reveal" style="--i:2"><div class="g-stat__value"><span data-count="6.5">0</span><span class="g-stat__unit"> años</span></div><div class="g-stat__label">Retorno de la inversión*</div><div class="g-stat__bar"><span style="--_v:40%"></span></div></div>
 </div>
 <p style="margin:24px 0 0;font-size:14px;color:var(--ink-muted)">*Cifras de ejemplo: sustituir por datos reales de Genera.</p>
</div>
<script>window.Genera && window.Genera.init(document);</script>
